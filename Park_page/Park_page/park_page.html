<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Park Page</title>
    <link rel="stylesheet" href="park_page.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>

<body>
    <div class="container">
        <h1 id="park-name"></h1>
        <button type="button" onclick="location.href='../../index.html'">Home</button>

      

        <div class="main-info">
            <div class="park-meta info-card">
                <h2>Park Details</h2>
                <p><strong>City:</strong> <span id="park-city"></span></p>
                <p><strong>State:</strong> <span id="park-state"></span></p>
                <p><strong>Total Rides Tracked by ThrillRanker:</strong> <span id="park-ride-count"></span></p>

            </div>

            <div class="park-map-panel info-card">
                <h2>Park Map</h2>
                <div id="park-map" class="park-map"></div>
                <p id="park-map-empty" class="empty-state"></p>
            </div>
        </div>

        <div class="park-rides-panel info-card">
            <h2>Rides</h2>
            <div id="park-rides-list" class="rides-grid"></div>
            <p id="park-rides-empty" class="empty-state"></p>
        </div>
    </div>
    
    



    <script type="module" src="park_page.js"></script>
</body>
</html>
