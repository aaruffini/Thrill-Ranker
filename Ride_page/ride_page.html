<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ride Page</title>
    <link rel="stylesheet" href="ride_page.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>
<body>
    <div id="ride-details">
        <h1 id="ride-name"></h1>

        <!-- Ride info  -->
        <p><strong>Park:</strong> <span id="ride-park"></span></p>
        <p><strong>Manufacturer:</strong> <span id="ride-manufacturer"></span></p>
        <p><strong>Model:</strong> <span id="ride-model"></span></p>
        <p><strong>Height:</strong> <span id="ride-height"></span></p>
        <p><strong>Speed:</strong> <span id="ride-speed"></span></p>
        <p><strong>Ride Time:</strong> <span id="ride-time"></span></p>
        <p><strong>Inversions:</strong> <span id="ride-inversions"></span></p>
        <p><strong>Lift System:</strong> <span id="ride-lift-system"></span></p>

        <!-- Ranking info  -->
        <p><strong>Green Circle Votes: </strong> <span id="green_count"></span> </p>
        <p><strong>Blue Square Votes: </strong> <span id="blue_count"></span></p>
        <p><strong>Black Diamond Votes: </strong> <span id="black_count"></span> </p>
        <p><strong>Double Black Diamond Votes: </strong><span id="double_black_count"></span></p>

        <!-- GIS info  -->
        <p><strong>Longitude:</strong><span id="longitude"></span></p>
        <p><strong>Latitude:</strong><span id="latitude"></span></p>

        <div1 id="map" style="height: 500px; width: 500px;"></div1>
    
    </div>


    <!-- Leaflet is loaded above; ride_page.js will initialize the map when coordinates are available -->




    <script type="module" src="ride_page.js"></script>
</body>
</html>
