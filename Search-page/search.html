<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thrill Ranker</title>
    <link rel="stylesheet" href="search.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>

<body>

    <div class="topnav">
        <input type="text" id="ride-search" placeholder="Search for a ride..">
        <div id="search-results"></div>
    </div>

    <script type="module">
        import { supabase } from '../supabaseClient.js';
        const searchInput = document.getElementById('ride-search');
        const searchResults = document.getElementById('search-results');
    
        searchInput.addEventListener('input', async (e) => {
        const query = e.target.value.trim();
    
        if (query.length < 2) { searchResults.innerHTML='' ; return; } const {data: rides, error }=await supabase .from('ride')
            .select('id, name') .ilike('name', `%${query}%`) .limit(10); if (error) { console.error('Error fetching rides:',
            error); searchResults.innerHTML='<p>Error searching for rides.</p>' ; return; } if (rides && rides.length> 0) {
            const rideLinks = rides.map(ride =>
            `<a href="../Ride_page/ride_page.html?id=${ride.id}">${ride.name}</a>`
            ).join('');
            searchResults.innerHTML = rideLinks;
            } else {
            searchResults.innerHTML = '<p>No rides found.</p>';
            }
        });
     </script>


</body>
