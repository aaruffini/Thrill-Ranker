<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Static Maps</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --btn-color: #2563eb;
            --btn-hover: #1d4ed8;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f7fffa;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        h1 {
            margin-bottom: 2rem;
        }

        .button-wrap {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-btn {
            display: inline-block;
            padding: 0.9rem 1.4rem;
            border: 0;
            border-radius: 10px;
            background: var(--btn-color);
            color: var(--text-color);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .nav-btn:hover {
            background: var(--btn-hover);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <h1>Click either button to see a static map, first is a rural and drive time map for the north east parks and the second is Huff Model map made with follium </h1>
    <div class="button-wrap">
        <a class="nav-btn" href="Rural_and_Drive_Time.html">Rural and Drive Time</a>
        <a class="nav-btn" href="roc_huff.html">ROC Huff</a>
    </div>
</body>
</html>
