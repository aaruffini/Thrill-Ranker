<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thrill Ranker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>
<body>

     <h1>Welcome to Thrill Ranker!</h1>

    
    <header class="top-bar">
        <div class="navigation-items">
            <div class="middlenav">
                <button id= "Search">Search</button>
                <button id="AboutThisSite">About</button>
                <button id="RankingSystem">Ranking</button>
                <button id="Sources">Sources</button>
                <button id="Contact">Contact</button>
                <button id="Auth">Login</button>
            </div>
        </div>
    </header>

   
    <div><h1>Select a park to Start!</h1></div>
     

    <div id="map" style="height: 500px;"></div>

    <div class="topnav">
        <input type="text" id="ride-search" placeholder="Search for a ride..">
        <div id="search-results"></div>
    </div>

    
    <script type="module">
        import { supabase } from './supabaseClient.js';

        const map = L.map('map').setView([39.5, -98.35], 4);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const searchInput = document.getElementById('ride-search');
        const searchResults = document.getElementById('search-results');
       

        searchInput.addEventListener('input', async (e) => {
            const query = e.target.value.trim();

            if (query.length < 2) {
                searchResults.innerHTML = '';
                return;
            }

            const {data: rides, error } = await supabase
                .from('ride')
                .select('id, name')
                .ilike('name', `%${query}%`)
                .limit(10);

            if (error) {
                console.error('Error fetching rides:', error);
                searchResults.innerHTML = '<p>Error searching for rides.</p>';
                return;
            }

            if (rides && rides.length > 0) {
                const rideLinks = rides.map(ride =>
                    `<a href="Ride_page/ride_page.html?id=${ride.id}">${ride.name}</a>`
                ).join('');
                searchResults.innerHTML = rideLinks;
            } else {
                searchResults.innerHTML = '<p>No rides found.</p>';
            }
        });

        async function loadParks() {
            const { data: parks, error } = await supabase
                .from('parks')
                .select('id, name, location:location::geometry');

            if (error) {
                console.error('Error loading parks:', error);
                return;
            }

            console.log('Parks data:', parks);

            parks.forEach(park => {
                if (park.location) {
                    // Location is a GeoJSON object: { type: "Point", coordinates: [lng, lat] }
                    // Leaflet expects [lat, lng]
                    const coordinates = park.location.coordinates;
                    L.marker([coordinates[1], coordinates[0]])
                        .addTo(map)
                        .bindPopup(`<h3><a href="Park_page/Park_page/park_page.html?id=${park.id}">${park.name}</a></h3>`);
                    
                }
            });
        }

        loadParks();

    </script>


    <script>
        document.getElementById("AboutThisSite").onclick = function () {
            window.location.href = "Frontend/about.html";
        };
        document.getElementById("RankingSystem").onclick = function () {
            window.location.href = "Frontend/ranking.html";
        };
        document.getElementById("Sources").onclick = function () {
            window.location.href = "Frontend/sources.html";
        };
        document.getElementById("Contact").onclick = function () {
            window.location.href = "Frontend/contact.html";
        };
        document.getElementById("Search").onclick = function () {
                window.location.href = "Search-page/search.html";
        };
        document.getElementById("Auth").onclick = function () {
            window.location.href = "Frontend/authentication.html";
        };
        

    </script>

</body>
</html>
