<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thrill Ranker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>
<body>

     <h1>Welcome to Thrill Ranker!</h1>

    
    <header class="top-bar">
        <div class="navigation-items">
            <div class="middlenav">
                <button id= "Search">Search</button>
                <button id="AboutThisSite">About</button>
                <button id="RankingSystem">Ranking</button>
                <button id="Sources">Sources</button>
                
                
                <button id="Auth">Login / Sign up!</button>
                <button id="sign-out-btn" style="display: none; background-color: #ff4d4d;">Sign Out</button>
            </div>
        </div>
    </header>

   
    <div><h2>Select a park to see info about it, or click search for a specific ride!</h2></div>
     
    <div id="map" style="height: 500px;"></div>


    
    <script type="module">
        import { supabase } from './supabaseClient.js';

        const map = L.map('map').setView([39.5, -98.35], 4);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        async function loadParks() {
            const { data: parks, error } = await supabase
                .from('parks')
                .select('id, name, location:location::geometry');

            if (error) {
                console.error('Error loading parks:', error);
                return;
            }

            console.log('Parks data:', parks);

            parks.forEach(park => {
                if (park.location) {
                    // Location is a GeoJSON object: { type: "Point", coordinates: [lng, lat] }
                    // Leaflet expects [lat, lng]
                    const coordinates = park.location.coordinates;
                    L.marker([coordinates[1], coordinates[0]])
                        .addTo(map)
                        .bindPopup(`<h3><a href="Park_page/Park_page/park_page.html?id=${park.id}">${park.name}</a></h3>`);
                    
                }
            });
        }

        loadParks();

        const authButton = document.getElementById('Auth');
        const signOutButton = document.getElementById('sign-out-btn');

        document.getElementById('AboutThisSite').addEventListener('click', () => {
            window.location.href = 'Frontend/about.html';
        });
        document.getElementById('RankingSystem').addEventListener('click', () => {
            window.location.href = 'Frontend/ranking.html';
        });
        document.getElementById('Sources').addEventListener('click', () => {
            window.location.href = 'Frontend/sources.html';
        });
        document.getElementById('Search').addEventListener('click', () => {
            window.location.href = 'Search-page/search.html';
        });
        document.getElementById('DriveTimeMap').addEventListener('click', () => {
            window.location.href = 'Static_maps/static_land.html';
        });
        authButton.onclick = () => window.location.href = "Frontend/authentication.html";

        signOutButton.addEventListener('click', async () => {
            await supabase.auth.signOut();
        });

        supabase.auth.onAuthStateChange((event, session) => {
            if (session) {
                authButton.style.display = 'none';
                signOutButton.style.display = 'inline-block';
            } else {
                authButton.style.display = 'inline-block';
                signOutButton.style.display = 'none';
            }
        });

    </script>

</body>
</html>
